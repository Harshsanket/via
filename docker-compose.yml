# Home-network hosting: the site is served at https://$VIA_HOST to every device
# on the LAN, with a trusted Let's Encrypt certificate and nothing to install.
# Setup guide: README.md.
#
#   cp .env.example .env               # fill in the values
#   docker compose up -d --build
#   docker compose logs -f via         # wait for "certificate obtained"
#
# Nothing here is port-forwarded on the router: the public DuckDNS name only
# ever resolves to the LAN IP, so the site exists only inside the home network.
#
# The whole app runs in one container:
#
#   LAN ──443──▶ caddy ──▶ nginx ──▶ api ──▶ redis
#                (TLS)    (frontend)  (signaling)
#   LAN ──3478─▶ coturn (fallback relay)
#   host only ──8081──▶ nginx (admin console; bound to 127.0.0.1)
#
# Caddy, nginx, the API, Redis and coturn share the container's loopback, so
# no service is reachable from the LAN except through Caddy or the relay's
# published ports.
name: via

services:
  via:
    build:
      context: .
      args:
        # Empty means same origin: the page talks to /api and /socket.io on
        # whatever host served it (frontend/src/lib/env.ts).
        VITE_SOCKET_SERVER_URL: ""
        VITE_API_BASE_URL: ""
    init: true
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
      - "3478:3478"
      - "3478:3478/udp"
      # A bounded relay range: enough for a handful of transfers, small enough
      # to publish, unlike the default 49152-65535.
      - "49300-49340:49300-49340/udp"
      # The admin console is reachable only from this host's loopback.
      - "127.0.0.1:8081:8081"
    environment:
      VIA_HOST: ${VIA_HOST:?set VIA_HOST in .env}
      LAN_IP: ${LAN_IP:?set LAN_IP in .env (or run ./scripts/start.sh)}
      DUCKDNS_DOMAIN: ${DUCKDNS_DOMAIN:?set DUCKDNS_DOMAIN in .env}
      DUCKDNS_TOKEN: ${DUCKDNS_TOKEN:?set DUCKDNS_TOKEN in .env}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      TURN_SECRET: ${TURN_SECRET:?set TURN_SECRET in .env}
      CLIENT_ORIGIN: https://${VIA_HOST}
      # These are the defaults; the host-only admin page persists overrides in
      # /config/settings.json.
      SETTINGS_PATH: /config/settings.json
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-600}
      REFRESH_SESSION_TTL_SECONDS: ${REFRESH_SESSION_TTL_SECONDS:-1800}
      SESSION_MAX_LIFETIME_SECONDS: ${SESSION_MAX_LIFETIME_SECONDS:-86400}
      SESSION_EXPIRY_WARNING_SECONDS: ${SESSION_EXPIRY_WARNING_SECONDS:-30}
      COMPLETED_SESSION_TTL_SECONDS: ${COMPLETED_SESSION_TTL_SECONDS:-30}
      # coturn answers STUN on the TURN port, so only the TURN URLs are listed.
      # An empty STUN list avoids offering the same relay twice in ICE.
      STUN_URLS: ""
      TURN_URLS: "turn:${VIA_HOST}:3478?transport=udp,turn:${VIA_HOST}:3478?transport=tcp"
      TURN_TTL_SECONDS: ${TURN_TTL_SECONDS:-86400}
    volumes:
      # Caddy's state, so restarts and rebuilds do not hit Let's Encrypt rate
      # limits. The admin settings volume keeps the password hash and token
      # secret out of the image.
      - caddy_data:/caddy-data
      - caddy_config:/caddy-config
      - settings:/config
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/lib/nginx
      - /var/run
      - /var/lib/coturn
      - /data
    read_only: true
    cap_drop: [ALL]
    cap_add:
      # Caddy binds 80/443.
      - NET_BIND_SERVICE
      # The entrypoint repairs tmpfs and settings-volume ownership, and nginx
      # drops its workers to the nginx user.
      - CHOWN
      - SETUID
      - SETGID
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    mem_limit: 640m
    pids_limit: 200
    stop_grace_period: 20s

volumes:
  caddy_data:
  caddy_config:
  settings:
